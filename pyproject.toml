[tool.ruff]
line-length = 100
target-version = "py311"
# The design document ships a snapshot of the scratch generators; leave it as it was.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "D", "N", "ANN", "C90", "PLR"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # tests compare against the literal values they expect

[tool.ruff.format]
quote-style = "double"
