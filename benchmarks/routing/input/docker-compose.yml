services:
  web:
    build: ./frontend
    ports: ["443:443"]
    depends_on: [api]
  api:
    build: ./shop
    environment:
      DATABASE_URL: postgres://shop@db/shop
      REDIS_URL: redis://cache:6379/0
      PAYMENTS_URL: https://api.payments.example
    depends_on: [db, cache]
  worker:
    build: ./shop
    command: python worker.py
    environment:
      DATABASE_URL: postgres://shop@db/shop
      REDIS_URL: redis://cache:6379/0
      SMTP_HOST: mail
    depends_on: [db, cache, mail]
  db:
    image: postgres:16
    volumes: [dbdata:/var/lib/postgresql/data]
  cache:
    image: redis:7
  mail:
    image: mailhog/mailhog
  backup:
    image: shop-backup
    environment:
      DATABASE_URL: postgres://shop@db/shop
      S3_BUCKET: shop-backups
volumes:
  dbdata: {}
