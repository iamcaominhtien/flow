<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Flow logo">
  <title>Flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1D4ED8"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <!-- start: green pill -->
  <rect x="34" y="38" width="76" height="38" rx="19" fill="#DCF5E1" stroke="#1E7A3C" stroke-width="5"/>
  <!-- process: blue box -->
  <rect x="146" y="98" width="76" height="46" rx="12" fill="#DCEEFB" stroke="#1E5AA8" stroke-width="5"/>
  <!-- decision: amber diamond -->
  <path d="M72 166L110 196L72 226L34 196Z" fill="#FFF1DD" stroke="#B45309" stroke-width="5" stroke-linejoin="round"/>
  <!-- end: rose pill -->
  <rect x="146" y="180" width="76" height="32" rx="16" fill="#FDE4E4" stroke="#B42318" stroke-width="5"/>
  <!-- main path, drawn as a dashed animated-looking blue line -->
  <path d="M110 57H184V94" fill="none" stroke="#1D4ED8" stroke-width="7" stroke-dasharray="14 9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M184 144V160H72V162" fill="none" stroke="#1D4ED8" stroke-width="7" stroke-dasharray="14 9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M110 196H142" fill="none" stroke="#B42318" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
